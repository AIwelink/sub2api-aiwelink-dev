name: Growth Public Canary

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-public-canary
  cancel-in-progress: true

jobs:
  referral-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROWTH_CANARY_BASE_URL: https://api.aiwelink.cc
      GROWTH_CANARY_REFERRAL_CODE: ${{ secrets.GROWTH_CANARY_REFERRAL_CODE }}
    steps:
      - uses: actions/checkout@v6
      - name: Run bounded public referral probe
        run: bash deploy/tests/growth-public-canary.sh
