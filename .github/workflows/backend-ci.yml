name: CI

on:
  push:
    branches: [aiwelink-dev, main]
  pull_request:
    branches: [aiwelink-dev, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/bash deploy/tests/image-publish-summary-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check AIWeLink growth deployment
        run: /bin/sh deploy/tests/aiwelink-growth-deployment-test.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Unit tests
        working-directory: backend
        run: make test-unit

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  growth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Growth registration contract
        working-directory: backend
        run: make test-growth-contract

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint, typecheck, and production build
        run: make test-frontend-checks

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Complete frontend Vitest suite
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run govulncheck
        working-directory: backend
        run: make security

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Validate audit exceptions
        run: >-
          python tools/check_pnpm_audit_exceptions.py
          --audit frontend/audit.json
          --exceptions .github/audit-exceptions.yml

  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository vulnerabilities, secrets, and misconfigurations
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build Go database
        if: matrix.language == 'go'
        working-directory: backend
        run: go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  ci-gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - shell
      - compose
      - unit-tests
      - integration-tests
      - growth-contract
      - frontend-checks
      - frontend-tests
      - golangci-lint
      - backend-security
      - frontend-security
      - repository-scan
      - codeql
    steps:
      - name: Require every CI dependency
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"

  publish-image:
    needs: ci-gate
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'aiwelink-dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.aiwelink.cc
      IMAGE_NAME: docker.aiwelink.cc/sub2api-aiwelink-dev
    steps:
      - id: checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid application version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract branch image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref_name == 'aiwelink-dev' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref_name == 'aiwelink-dev' }}
            type=sha,prefix=main-,format=short,enable=${{ github.ref_name == 'main' }}

      - name: Select immutable image for scanning
        id: image
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "aiwelink-dev" ]; then
            PREFIX=dev
          else
            PREFIX=main
          fi
          echo "scan-ref=${IMAGE_NAME}:${PREFIX}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build branch image locally
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=aiwelink-image-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=aiwelink-image-${{ github.ref_name }}

      - name: Scan branch image before publish
        id: scan
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          version: v0.73.0
          scan-type: image
          image-ref: ${{ steps.image.outputs.scan-ref }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify registry credentials
        id: credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.AIWELINK_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.AIWELINK_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::Configure AIWELINK_REGISTRY_USERNAME and AIWELINK_REGISTRY_PASSWORD."
            exit 1
          fi

      - name: Log in to AIWeLink registry
        id: login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.AIWELINK_REGISTRY_USERNAME }}
          password: ${{ secrets.AIWELINK_REGISTRY_PASSWORD }}

      - name: Push tested branch tags
        id: push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"

      - name: Resolve published image digest
        id: digest
        if: steps.push.outcome == 'success'
        continue-on-error: true
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.scan-ref }}
        shell: bash
        run: |
          MANIFEST="$(docker buildx imagetools inspect "$IMMUTABLE_IMAGE" --format '{{json .Manifest}}')"
          DIGEST="$(jq -r '.digest // empty' <<<"$MANIFEST")"
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve a valid digest for $IMMUTABLE_IMAGE"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish image summary
        if: always()
        env:
          APPLICATION_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          BUILDX_OUTCOME: ${{ steps.buildx.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          META_OUTCOME: ${{ steps.meta.outcome }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          DIGEST_OUTCOME: ${{ steps.digest.outcome }}
        shell: bash
        run: |
          if [ -f deploy/image-publish-summary.sh ]; then
            bash deploy/image-publish-summary.sh
            exit 0
          fi

          if [ "$GITHUB_REF_NAME" = aiwelink-dev ]; then
            MUTABLE_TAG="$IMAGE_NAME:dev"
            IMMUTABLE_TAG="$IMAGE_NAME:dev-${GITHUB_SHA::12}"
          else
            MUTABLE_TAG="$IMAGE_NAME:latest"
            IMMUTABLE_TAG="$IMAGE_NAME:main-${GITHUB_SHA::12}"
          fi
          FAILURE_STAGE=checkout
          if [ "${CHECKOUT_OUTCOME:-skipped}" = success ]; then
            FAILURE_STAGE=summary-script
          fi
          {
            printf '## AIWeLink image publication\n\n'
            printf '| Field | Value |\n| --- | --- |\n'
            printf '| Publish status | `failure` |\n'
            printf '| Failure stage | `%s` |\n' "$FAILURE_STAGE"
            printf '| Branch | `%s` |\n' "$GITHUB_REF_NAME"
            printf '| Commit | `%s` |\n' "$GITHUB_SHA"
            printf '| Application version | `unknown` |\n'
            printf '| Upstream version | `unknown` |\n'
            printf '| Mutable tag | `%s` |\n' "$MUTABLE_TAG"
            printf '| Immutable tag | `%s` |\n' "$IMMUTABLE_TAG"
            printf '| Digest | `unavailable` |\n\n'
            printf 'Image was not published; pull commands are unavailable.\n'
          } >> "$GITHUB_STEP_SUMMARY"
