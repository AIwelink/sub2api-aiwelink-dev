name: Publish AIWeLink Branch Image

on:
  push:
    branches:
      - aiwelink-dev
      - main

permissions:
  contents: read

concurrency:
  group: aiwelink-image-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: docker.aiwelink.cc
  IMAGE_NAME: docker.aiwelink.cc/sub2api-aiwelink-dev

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::backend/cmd/server/VERSION is empty."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid application version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.AIWELINK_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.AIWELINK_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::Configure AIWELINK_REGISTRY_USERNAME and AIWELINK_REGISTRY_PASSWORD repository secrets."
            exit 1
          fi

      - name: Log in to AIWeLink container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.AIWELINK_REGISTRY_USERNAME }}
          password: ${{ secrets.AIWELINK_REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref_name == 'aiwelink-dev' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref_name == 'aiwelink-dev' }}
            type=sha,prefix=main-,format=short,enable=${{ github.ref_name == 'main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=aiwelink-image-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=aiwelink-image-${{ github.ref_name }}
